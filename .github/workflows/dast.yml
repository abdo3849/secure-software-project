name: DAST Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  dast:
    name: Dynamic Analysis (OWASP ZAP)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Flask application in background
        run: |
          nohup python app.py > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application to become available
        run: |
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:5000/ > /dev/null; then
              echo "App is up."
              exit 0
            fi
            echo "Waiting for app... ($i)"
            sleep 1
          done
          echo "App did not start in time."
          cat app.log
          exit 1

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: "http://127.0.0.1:5000"
          cmd_options: "-a"
          fail_action: false
          artifact_name: "zap-baseline-report"

      - name: Move ZAP report into reports folder
        run: |
          cp -f report_html.html reports/zap-report.html 2>/dev/null || true
          cp -f report_md.md reports/zap-report.md 2>/dev/null || true
          cp -f report_json.json reports/zap-report.json 2>/dev/null || true
          ls -la reports/ || true

      - name: Add ZAP report to workflow summary
        run: |
          if [ -f reports/zap-report.md ]; then
            cat reports/zap-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ZAP markdown report not found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop Flask application
        if: always()
        run: kill $(cat app.pid) || true

      - name: Upload application log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: app.log
          retention-days: 7

      - name: Upload DAST reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports

          path: reports/
          retention-days: 30
