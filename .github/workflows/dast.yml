name: DAST Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  dast:
    name: Dynamic Analysis (OWASP ZAP)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Flask application in background
        run: |
          nohup python app.py > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application to become available
        run: |
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:5000/ > /dev/null; then
              echo "App is up."
              exit 0
            fi
            echo "Waiting for app... ($i)"
            sleep 1
          done
          echo "App did not start in time."
          cat app.log
          exit 1

      - name: Create reports directory
        run: mkdir -p reports && chmod 777 reports

      - name: Run OWASP ZAP Baseline Scan (Docker)
        run: |
          docker run --rm --network host \
            -v $(pwd)/reports:/zap/wrk/:rw \
            -t zaproxy/zap-stable \
            zap-baseline.py \
            -t http://127.0.0.1:5000 \
            -r zap-report.html \
            -w zap-report.md \
            -J zap-report.json \
            -a || true

      - name: List reports directory
        run: ls -la reports/ || true

      - name: Add ZAP report to workflow summary
        run: |
          if [ -f reports/zap-report.md ]; then
            cat reports/zap-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ZAP markdown report not found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop Flask application
        if: always()
        run: kill $(cat app.pid) || true

      - name: Upload application log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: app.log
          retention-days: 7

      - name: Upload DAST reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports
          path: reports/
          retention-days: 30
